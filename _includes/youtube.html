{%- comment -%}
  Privacy-friendly YouTube embed: shows the thumbnail, loads the player only on click.
  Usage: {% include youtube.html id="naPyMYgFnXQ" title="Trailer" title_fr="Bande annonce" title_es="Tráiler" %}
{%- endcomment -%}
{%- assign play = site.data.i18n.play_video -%}
<figure class="video">
  <button class="video-poster" type="button" data-youtube="{{ include.id }}"
    aria-label="{{ play.en }}{% if include.title %}: {{ include.title | escape }}{% endif %}"
    data-aria-label-fr="{{ play.fr }}{% if include.title %} : {{ include.title_fr | default: include.title | escape }}{% endif %}"
    data-aria-label-es="{{ play.es }}{% if include.title %}: {{ include.title_es | default: include.title | escape }}{% endif %}">
    <img src="https://i.ytimg.com/vi/{{ include.id }}/hqdefault.jpg" alt="" loading="lazy">
    <span class="video-play" aria-hidden="true"></span>
  </button>
  {% if include.title %}<figcaption>{% include t.html obj=include field="title" %}</figcaption>{% endif %}
</figure>
