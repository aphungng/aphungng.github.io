{%- comment -%} English by default; ?lang=fr|es or a previous choice switches before the page is drawn. {%- endcomment %}
<script>(function(d){var l;try{l=new URLSearchParams(location.search).get("lang")||localStorage.getItem("lang")}catch(e){}if(l==="fr"||l==="es")d.lang=l;d.classList.add("js")})(document.documentElement)</script>
